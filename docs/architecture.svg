<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
  <title id="title">Indoor Delivery Robot system architecture</title>
  <desc id="desc">The Next.js portal connects people to FastAPI and PostgreSQL. An authenticated Robot Agent bridges FastAPI to ROS 2 autonomy and the robot environment.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07142f"/><stop offset="1" stop-color="#102b5b"/></linearGradient>
    <linearGradient id="robot" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#047857"/><stop offset="1" stop-color="#0f766e"/></linearGradient>
    <filter id="shadow"><feDropShadow dy="10" stdDeviation="12" flood-color="#020617" flood-opacity=".4"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#60a5fa"/></marker>
    <style>
      .heading{font:700 42px system-ui,sans-serif;fill:#f8fafc}.sub{font:400 20px system-ui,sans-serif;fill:#a9bad3}.tag{font:700 14px system-ui,sans-serif;letter-spacing:1.8px;fill:#7dd3fc}.name{font:700 25px system-ui,sans-serif;fill:#fff}.copy{font:400 17px system-ui,sans-serif;fill:#cbd5e1}.flow{stroke:#60a5fa;stroke-width:4;fill:none;marker-end:url(#arrow)}.edge{stroke:#34d399;stroke-width:4;stroke-dasharray:10 9;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="820" rx="30" fill="url(#background)"/><circle cx="1480" cy="20" r="260" fill="#2563eb" opacity=".08"/><circle cx="60" cy="810" r="260" fill="#14b8a6" opacity=".06"/>
  <text x="70" y="72" class="tag">END-TO-END AUTONOMOUS DELIVERY</text><text x="70" y="125" class="heading">System architecture</text><text x="70" y="164" class="sub">A full-stack product connected to live robot autonomy through explicit trust boundaries.</text>
  <g filter="url(#shadow)"><rect x="70" y="245" width="245" height="205" rx="24" fill="#11264c" stroke="#29466f"/><circle cx="120" cy="300" r="23" fill="#2563eb"/><path d="M108 311c2-14 22-14 24 0m-12-31a9 9 0 1 1 0 18 9 9 0 0 1 0-18" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/><text x="158" y="309" class="name">People</text><text x="100" y="359" class="copy">Delivery users</text><text x="100" y="390" class="copy">Administrators</text><text x="100" y="421" class="copy">English / Thai</text></g>
  <g filter="url(#shadow)"><rect x="385" y="220" width="330" height="255" rx="24" fill="#11264c" stroke="#3974c9"/><text x="415" y="264" class="tag">WEB EXPERIENCE</text><text x="415" y="319" class="name">Next.js Portal</text><text x="415" y="362" class="copy">User delivery workspace</text><text x="415" y="393" class="copy">Admin control center</text><text x="415" y="424" class="copy">Live maps and workflows</text></g>
  <g filter="url(#shadow)"><rect x="790" y="220" width="330" height="255" rx="24" fill="#11264c" stroke="#3974c9"/><text x="820" y="264" class="tag">APPLICATION CORE</text><text x="820" y="319" class="name">FastAPI</text><text x="820" y="362" class="copy">Authentication and RBAC</text><text x="820" y="393" class="copy">Task state machine and queue</text><text x="820" y="424" class="copy">REST and WebSocket events</text></g>
  <g filter="url(#shadow)"><rect x="1195" y="245" width="335" height="205" rx="24" fill="#11264c" stroke="#3974c9"/><text x="1225" y="289" class="tag">PERSISTENCE</text><text x="1225" y="344" class="name">PostgreSQL</text><text x="1225" y="387" class="copy">Operational state, users,</text><text x="1225" y="418" class="copy">notifications, and audit history</text></g>
  <path d="M315 348h62" class="flow"/><path d="M715 348h67" class="flow"/><path d="M1120 348h67" class="flow"/>
  <g filter="url(#shadow)"><rect x="385" y="580" width="330" height="185" rx="24" fill="url(#robot)" stroke="#34d399"/><text x="415" y="624" class="tag" fill="#d1fae5">ROBOT EDGE</text><text x="415" y="679" class="name">Robot Agent</text><text x="415" y="722" class="copy">Authenticated command bridge</text><text x="415" y="751" class="copy">Telemetry and result publisher</text></g>
  <g filter="url(#shadow)"><rect x="790" y="555" width="330" height="235" rx="24" fill="url(#robot)" stroke="#34d399"/><text x="820" y="599" class="tag" fill="#d1fae5">ROS 2 JAZZY</text><text x="820" y="654" class="name">Autonomy Stack</text><text x="820" y="697" class="copy">Nav2 navigation</text><text x="820" y="728" class="copy">SLAM Toolbox and AMCL</text><text x="820" y="759" class="copy">Sensors and diagnostics</text></g>
  <g filter="url(#shadow)"><rect x="1195" y="580" width="335" height="185" rx="24" fill="url(#robot)" stroke="#34d399"/><text x="1225" y="624" class="tag" fill="#d1fae5">ENVIRONMENT</text><text x="1225" y="679" class="name">Gazebo or AMR</text><text x="1225" y="722" class="copy">LiDAR · camera · odometry</text><text x="1225" y="751" class="copy">Motion and safety interfaces</text></g>
  <path d="M955 475v72" class="edge"/><path d="M782 674h-59" class="edge"/><path d="M1120 674h67" class="edge"/><text x="972" y="521" class="tag">ROBOT WEBSOCKET</text>
</svg>
