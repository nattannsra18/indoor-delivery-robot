<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="675" viewBox="0 0 1600 450" role="img" aria-labelledby="title desc">
  <title id="title">Autonomous delivery workflow</title><desc id="desc">Seven steps from selecting stations to completing a delivery.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#eaf4ff"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2563eb"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient>
    <filter id="shadow"><feDropShadow dy="7" stdDeviation="8" flood-color="#1e3a5f" flood-opacity=".13"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#60a5fa"/></marker>
    <style>.heading{font:700 38px system-ui,sans-serif;fill:#0f2347}.sub{font:500 20px system-ui,sans-serif;fill:#52698f}.num{font:700 19px system-ui,sans-serif;fill:#fff}.name{font:700 19px system-ui,sans-serif;fill:#102347}.copy{font:500 14px system-ui,sans-serif;fill:#52647f}.line{stroke:#60a5fa;stroke-width:5;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1600" height="450" rx="28" fill="url(#bg)"/><text x="55" y="65" class="heading">From request to arrival</text><text x="55" y="98" class="sub">One authoritative workflow keeps the user portal, operator controls, and robot mission in sync.</text>
  <path d="M240 265h28m-4 0h28m158 0h32m-4 0h28m158 0h32m-4 0h28m158 0h32m-4 0h28m158 0h32m-4 0h28" class="line"/>
  <g filter="url(#shadow)"><rect x="50" y="160" width="190" height="200" rx="20" fill="#fff" stroke="#d7e5f7"/><circle cx="90" cy="203" r="21" fill="url(#blue)"/><text x="85" y="209" class="num">1</text><text x="76" y="260" class="name">Select stations</text><text x="76" y="298" class="copy">Pickup and destination</text><text x="76" y="321" class="copy">from the live map</text></g>
  <g filter="url(#shadow)"><rect x="264" y="160" width="190" height="200" rx="20" fill="#fff" stroke="#d7e5f7"/><circle cx="304" cy="203" r="21" fill="url(#blue)"/><text x="299" y="209" class="num">2</text><text x="290" y="260" class="name">Validate route</text><text x="290" y="298" class="copy">Nav2 path, distance,</text><text x="290" y="321" class="copy">and travel estimate</text></g>
  <g filter="url(#shadow)"><rect x="478" y="160" width="190" height="200" rx="20" fill="#fff" stroke="#d7e5f7"/><circle cx="518" cy="203" r="21" fill="url(#blue)"/><text x="513" y="209" class="num">3</text><text x="504" y="260" class="name">Queue request</text><text x="504" y="298" class="copy">Estimated start and</text><text x="504" y="321" class="copy">completion remain live</text></g>
  <g filter="url(#shadow)"><rect x="692" y="160" width="190" height="200" rx="20" fill="#fff" stroke="#d7e5f7"/><circle cx="732" cy="203" r="21" fill="url(#blue)"/><text x="727" y="209" class="num">4</text><text x="718" y="260" class="name">Navigate pickup</text><text x="718" y="298" class="copy">Live pose, path, and</text><text x="718" y="321" class="copy">mission feedback</text></g>
  <g filter="url(#shadow)"><rect x="906" y="160" width="190" height="200" rx="20" fill="#fff" stroke="#d7e5f7"/><circle cx="946" cy="203" r="21" fill="url(#blue)"/><text x="941" y="209" class="num">5</text><text x="932" y="260" class="name">Confirm loading</text><text x="932" y="298" class="copy">Secure package handoff</text><text x="932" y="321" class="copy">before departure</text></g>
  <g filter="url(#shadow)"><rect x="1120" y="160" width="190" height="200" rx="20" fill="#fff" stroke="#d7e5f7"/><circle cx="1160" cy="203" r="21" fill="url(#blue)"/><text x="1155" y="209" class="num">6</text><text x="1146" y="260" class="name">Deliver package</text><text x="1146" y="298" class="copy">Autonomous navigation</text><text x="1146" y="321" class="copy">to the destination</text></g>
  <g filter="url(#shadow)"><rect x="1334" y="160" width="216" height="200" rx="20" fill="#e9fff7" stroke="#6ee7b7"/><circle cx="1374" cy="203" r="21" fill="#059669"/><text x="1369" y="209" class="num">7</text><text x="1360" y="260" class="name">Complete</text><text x="1360" y="298" class="copy">Receipt confirmation,</text><text x="1360" y="321" class="copy">history, and audit trail</text></g>
</svg>
