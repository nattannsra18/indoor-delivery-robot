<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#222"/></marker>
    <marker id="blueArrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L11,4 L0,8 Z" fill="#1769e0"/></marker>
    <style>
      text { font-family: "DejaVu Sans", sans-serif; fill:#172033; }
      .title { font-size:32px; font-weight:700; }
      .label { font-size:21px; }
      .small { font-size:17px; }
      .dim { stroke:#222; stroke-width:2; fill:none; marker-start:url(#arrow); marker-end:url(#arrow); }
      .guide { stroke:#697386; stroke-width:1.5; stroke-dasharray:7 6; fill:none; }
      .axis { stroke-width:4; fill:none; marker-end:url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="#f7f9fc"/>
  <rect x="18" y="18" width="1164" height="680" rx="10" fill="white" stroke="#27364d" stroke-width="2"/>
  <text x="42" y="62" class="title">มุมมองจากด้านบน (TOP VIEW)</text>

  <!-- Direction -->
  <line x1="185" y1="380" x2="65" y2="380" stroke="#1769e0" stroke-width="12" marker-end="url(#blueArrow)"/>
  <text x="57" y="425" font-size="28" font-weight="700" fill="#1769e0">ด้านหน้า</text>

  <!-- Chassis: 36 x 30 cm, 18 px/cm -->
  <rect x="250" y="120" width="648" height="540" rx="8" fill="#e8edf3" stroke="#182437" stroke-width="4"/>
  <text x="540" y="105" class="small">ตัวรถ 36 × 30 ซม.</text>
  <text x="255" y="148" class="small">ซ้าย</text>
  <text x="255" y="650" class="small">ขวา</text>

  <!-- Assumed wheel axle at longitudinal midpoint -->
  <line x1="574" y1="75" x2="574" y2="735" class="guide"/>
  <rect x="516" y="48" width="116" height="72" rx="18" fill="#30343b" stroke="#111" stroke-width="3"/>
  <rect x="516" y="660" width="116" height="72" rx="18" fill="#30343b" stroke="#111" stroke-width="3"/>
  <text x="600" y="83" class="small">ล้อซ้าย</text>
  <text x="600" y="716" class="small">ล้อขวา</text>
  <text x="585" y="350" class="small" fill="#6b7280">ตำแหน่งเพลาล้อสมมติ</text>
  <text x="585" y="374" class="small" fill="#6b7280">(ยังไม่ได้วัด)</text>

  <!-- MPU at x=3.0 cm, y=center -->
  <line x1="304" y1="120" x2="304" y2="660" class="guide"/>
  <rect x="286" y="372" width="36" height="36" rx="4" fill="#3aa7ff" stroke="#0c3559" stroke-width="3"/>
  <line x1="304" y1="390" x2="250" y2="390" stroke="#e34234" class="axis"/>
  <line x1="304" y1="390" x2="304" y2="325" stroke="#27a844" class="axis"/>
  <circle cx="304" cy="390" r="10" fill="white" stroke="#222" stroke-width="2"/>
  <circle cx="304" cy="390" r="3.5" fill="#1769e0"/>
  <text x="334" y="333" class="label" font-weight="700">MPU6050</text>
  <text x="334" y="358" class="small">กึ่งกลางด้านหน้า</text>
  <text x="334" y="383" class="small">ห่างขอบหน้า 3.0 ซม.</text>
  <text x="222" y="428" class="small" fill="#e34234">X ไปหน้า</text>
  <text x="315" y="321" class="small" fill="#27a844">Y ไปซ้าย</text>
  <text x="320" y="410" class="small" fill="#1769e0">Z ขึ้น</text>

  <!-- LiDAR x=34.5 cm, y=15.5 cm from left -->
  <line x1="871" y1="90" x2="871" y2="680" class="guide"/>
  <circle cx="871" cy="399" r="35" fill="#ff8a1f" stroke="#34200e" stroke-width="4"/>
  <circle cx="871" cy="399" r="6" fill="#27364d"/>
  <line x1="906" y1="399" x2="953" y2="399" stroke="#596778" stroke-width="10"/>
  <text x="760" y="338" class="label" font-weight="700">YD LiDAR X3</text>
  <text x="724" y="459" class="small">จากขอบหน้า 34.5 ซม.</text>
  <text x="710" y="484" class="small">จากซ้าย 15.5 / จากขวา 14.5 ซม.</text>
  <text x="724" y="509" class="small">= เยื้องขวาจากกึ่งกลาง 0.5 ซม.</text>

  <!-- Dimension lines -->
  <line x1="250" y1="190" x2="898" y2="190" class="dim"/>
  <line x1="250" y1="182" x2="250" y2="210" class="guide"/><line x1="898" y1="182" x2="898" y2="210" class="guide"/>
  <text x="545" y="180" class="label">36 ซม.</text>
  <line x1="935" y1="120" x2="935" y2="660" class="dim"/>
  <text x="950" y="398" class="label">30 ซม.</text>
  <line x1="1010" y1="48" x2="1010" y2="732" class="dim"/>
  <text x="1028" y="365" class="small">38 ซม.</text>
  <text x="1028" y="389" class="small">ขอบล้อถึงขอบล้อ</text>
  <line x1="250" y1="635" x2="304" y2="635" class="dim"/>
  <text x="255" y="628" class="small">3.0 ซม.</text>
  <line x1="250" y1="675" x2="871" y2="675" class="dim"/>
  <text x="645" y="695" class="small">34.5 ซม. ถึงศูนย์กลาง LiDAR</text>

  <!-- Side view -->
  <rect x="18" y="715" width="1164" height="267" rx="10" fill="white" stroke="#27364d" stroke-width="2"/>
  <text x="42" y="758" class="title">มุมมองด้านข้าง (SIDE VIEW — ย่อส่วน)</text>
  <line x1="185" y1="845" x2="65" y2="845" stroke="#1769e0" stroke-width="12" marker-end="url(#blueArrow)"/>
  <text x="57" y="890" font-size="26" font-weight="700" fill="#1769e0">ด้านหน้า</text>
  <line x1="205" y1="945" x2="1125" y2="945" stroke="#222" stroke-width="4"/>
  <text x="1132" y="951" class="small">พื้น</text>
  <!-- side chassis: 14 px/cm -->
  <rect x="300" y="825" width="504" height="78" fill="#e8edf3" stroke="#182437" stroke-width="4"/>
  <circle cx="552" cy="899" r="45.5" fill="#30343b" stroke="#111" stroke-width="4"/>
  <circle cx="552" cy="899" r="21" fill="#b7c0cb" stroke="#222" stroke-width="3"/>
  <rect x="332" y="810" width="34" height="15" rx="3" fill="#3aa7ff" stroke="#0c3559" stroke-width="2"/>
  <text x="322" y="797" class="small">MPU6050 (ความสูงยังไม่ระบุ)</text>
  <!-- LiDAR at 34.5 cm and 39.5 cm above ground -->
  <line x1="783" y1="825" x2="783" y2="760" stroke="#4b5563" stroke-width="14"/>
  <rect x="760" y="728" width="46" height="32" rx="5" fill="#ff8a1f" stroke="#34200e" stroke-width="4"/>
  <text x="820" y="750" class="label">LiDAR สูงจากพื้น 39.5 ซม.</text>
  <line x1="830" y1="744" x2="830" y2="945" class="dim"/>
  <text x="845" y="855" class="small">39.5 ซม. (ย่อสเกลแนวตั้ง)</text>
  <text x="282" y="970" class="small" fill="#6b7280">หมายเหตุ: เพลาล้อวางไว้กลางรถเพื่อสื่อภาพเท่านั้น ต้องใช้ระยะจริงจากขอบหน้าถึงศูนย์กลางเพลามาแก้แบบ</text>
</svg>
