services:
  postgres:
    image: postgres:16-alpine
    container_name: indoor-delivery-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: indoor_delivery
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - indoor_delivery_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d indoor_delivery"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  indoor_delivery_postgres_data:
